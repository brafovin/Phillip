<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>浪人伝説 — Rōnin: Schatten des Heian</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; display:flex; justify-content:center; align-items:center;
         min-height:100vh; font-family:'Georgia',serif; overflow:hidden; }
  #gameCanvas { display:block; cursor:crosshair; image-rendering:pixelated; }
  #hud {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    display:flex; gap:16px; align-items:flex-end; pointer-events:none;
    z-index:20; opacity:0; transition:opacity 0.5s;
  }
  .hud-bar { display:flex; flex-direction:column; gap:4px; align-items:center; }
  .bar-label { color:#c9a84c; font-size:11px; letter-spacing:2px; text-transform:uppercase; }
  .bar-bg { width:140px; height:10px; background:rgba(0,0,0,0.6);
            border:1px solid #5a4a2a; border-radius:2px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:2px; transition:width 0.3s; }
  #hp-fill   { background:linear-gradient(90deg,#8b0000,#e53333); }
  #ki-fill   { background:linear-gradient(90deg,#003388,#4488ff); }
  #xp-fill   { background:linear-gradient(90deg,#664400,#ffaa00); }
  #stat-panel {
    position:fixed; left:20px; top:50%; transform:translateY(-50%);
    background:rgba(0,0,0,0.75); border:1px solid #4a3a1a;
    padding:12px 16px; color:#c9a84c; font-size:12px; line-height:22px;
    letter-spacing:1px; z-index:20; opacity:0; transition:opacity 0.5s;
    min-width:130px;
  }
  #stat-panel h3 { font-size:13px; border-bottom:1px solid #4a3a1a;
                   margin-bottom:6px; padding-bottom:4px; color:#e8c87a; }
  #msgbox {
    position:fixed; top:80px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.82); border:1px solid #6a5a3a;
    color:#e8d4a0; padding:10px 24px; font-size:14px; letter-spacing:1px;
    z-index:30; opacity:0; transition:opacity 0.4s; pointer-events:none;
    text-align:center; max-width:500px;
  }
  #controls-hint {
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
    color:rgba(180,160,100,0.6); font-size:11px; letter-spacing:2px;
    z-index:20; opacity:0; transition:opacity 0.5s; pointer-events:none;
    text-align:center;
  }
  #level-up-flash {
    position:fixed; top:0;left:0;width:100%;height:100%;
    background:rgba(255,200,0,0.12); pointer-events:none;
    z-index:25; opacity:0; transition:opacity 0.3s;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hud">
  <div class="hud-bar">
    <div class="bar-label">Leben</div>
    <div class="bar-bg"><div class="bar-fill" id="hp-fill" style="width:100%"></div></div>
  </div>
  <div class="hud-bar">
    <div class="bar-label">Ki</div>
    <div class="bar-bg"><div class="bar-fill" id="ki-fill" style="width:100%"></div></div>
  </div>
  <div class="hud-bar">
    <div class="bar-label">Erfahrung</div>
    <div class="bar-bg"><div class="bar-fill" id="xp-fill" style="width:0%"></div></div>
  </div>
</div>
<div id="stat-panel">
  <h3>統計 Statistiken</h3>
  <div id="stat-str">Stärke:    1</div>
  <div id="stat-def">Verteidigung: 1</div>
  <div id="stat-spd">Geschwindigkeit: 1</div>
  <div id="stat-ki">Ki-Kraft:  1</div>
  <div id="stat-lvl">Stufe: 1</div>
  <div id="stat-kills">Besiegte: 0</div>
</div>
<div id="msgbox"></div>
<div id="controls-hint">
  WASD Bewegen · Shift Rennen · Leertaste/Klick Angriff · Q Ki-Angriff · E Interagieren
</div>
<div id="level-up-flash"></div>

<script>
// ═══════════════════════════════════════════════════════════════
//  RŌNIN: Schatten des Heian — Top-Down Complete Rewrite
// ═══════════════════════════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

const CW = 900, CH = 600;
function resize() {
  const s = Math.min(window.innerWidth/CW, window.innerHeight/CH, 1.4);
  canvas.width  = CW;
  canvas.height = CH;
  canvas.style.width  = (CW*s)+'px';
  canvas.style.height = (CH*s)+'px';
}
resize();
window.addEventListener('resize', resize);

// ─── TILE SYSTEM ─────────────────────────────────────────────
const TILE = 40;
const MAP_W = 80, MAP_H = 50;
const WORLD_PX_W = MAP_W * TILE;
const WORLD_PX_H = MAP_H * TILE;

// Tile types
const T = {
  GRASS:0, STONE_PATH:1, WATER:2, SAND:3, WOOD:4,
  DARK_STONE:5, LAVA:6, DIRT:7, GRAVEL:8, SNOW:9,
  WALL:10, DEEP_WATER:11, BAMBOO:12,
};

// Color palettes per tile
const TILE_COLORS = {
  [T.GRASS]:      ['#3a7a2a','#3d8030','#2e6622','#4a8a35'],
  [T.STONE_PATH]: ['#8a7a6a','#7a6a5a','#9a8a7a','#857565'],
  [T.WATER]:      ['#1a4a7a','#1e527a','#15426e','#1d4e7e'],
  [T.SAND]:       ['#c8a85a','#d0b060','#bca050','#c8a858'],
  [T.WOOD]:       ['#7a5230','#6a4828','#7a5535','#6e4c2c'],
  [T.DARK_STONE]: ['#2a2828','#222020','#2e2c2c','#262424'],
  [T.LAVA]:       ['#cc3300','#e03800','#bb2800','#cc3500'],
  [T.DIRT]:       ['#6a4a2a','#5e4226','#6a4c2e','#624828'],
  [T.GRAVEL]:     ['#5a5050','#504848','#5a5252','#525050'],
  [T.SNOW]:       ['#e8f0f8','#dce8f8','#e0ecf8','#e4eef8'],
  [T.WALL]:       ['#3a3030','#302828','#3e3434','#363232'],
  [T.DEEP_WATER]: ['#0a2a4a','#082440','#0a2a4e','#0c2c52'],
  [T.BAMBOO]:     ['#2a5a1a','#305e1e','#2a5a1c','#305a1c'],
};

// tile map
let tileMap = new Uint8Array(MAP_W * MAP_H);

function tileAt(tx, ty) {
  if (tx<0||tx>=MAP_W||ty<0||ty>=MAP_H) return T.WALL;
  return tileMap[ty*MAP_W+tx];
}
function setTile(tx, ty, type) {
  if (tx<0||tx>=MAP_W||ty<0||ty>=MAP_H) return;
  tileMap[ty*MAP_W+tx] = type;
}
function fillRect(tx, ty, tw, th, type) {
  for (let y=ty; y<ty+th; y++)
    for (let x=tx; x<tx+tw; x++)
      setTile(x, y, type);
}
function drawLineH(tx, ty, len, type) { fillRect(tx,ty,len,1,type); }
function drawLineV(tx, ty, len, type) { fillRect(tx,ty,1,len,type); }

function buildMap() {
  // Base: grass everywhere
  tileMap.fill(T.GRASS);

  // ── ZONE 1: Starting Village (x:0–24) ──
  // Main path (horizontal)
  fillRect(0,22,26,2,T.STONE_PATH);
  // Village paths
  fillRect(5,18,2,10,T.STONE_PATH);
  fillRect(12,18,2,10,T.STONE_PATH);
  fillRect(18,18,2,10,T.STONE_PATH);
  // Buildings (wood floors inside)
  // Building 1
  fillRect(6,14,6,7,T.WOOD);
  fillRect(5,13,8,1,T.DARK_STONE); fillRect(5,21,8,1,T.DARK_STONE);
  fillRect(5,13,1,9,T.DARK_STONE); fillRect(13,13,1,9,T.DARK_STONE);
  // Building 2
  fillRect(14,14,5,6,T.WOOD);
  fillRect(13,13,7,1,T.DARK_STONE); fillRect(13,20,7,1,T.DARK_STONE);
  fillRect(13,13,1,8,T.DARK_STONE); fillRect(20,13,1,8,T.DARK_STONE);
  // Building 3
  fillRect(7,26,5,5,T.WOOD);
  fillRect(6,25,7,1,T.DARK_STONE); fillRect(6,31,7,1,T.DARK_STONE);
  fillRect(6,25,1,7,T.DARK_STONE); fillRect(13,25,1,7,T.DARK_STONE);
  // Garden / pond
  fillRect(2,14,3,7,T.WATER);
  fillRect(1,15,1,5,T.SAND);
  fillRect(5,15,1,5,T.SAND);
  fillRect(2,14,3,1,T.SAND);
  fillRect(2,20,3,1,T.SAND);
  // Sand around pond
  // Dirt paths in village
  fillRect(2,22,3,3,T.DIRT);

  // ── ZONE 2: Bamboo Forest (x:24–44) ──
  fillRect(24,0,20,MAP_H,T.BAMBOO);
  // Path through bamboo
  fillRect(24,21,20,4,T.DIRT);
  // Clearings
  fillRect(28,10,5,5,T.GRASS);
  fillRect(35,30,6,5,T.GRASS);
  // Narrow side paths
  fillRect(30,15,2,6,T.DIRT);
  fillRect(38,25,2,8,T.DIRT);

  // ── ZONE 3: Mountain Shrine (x:44–62) ──
  fillRect(44,0,18,MAP_H,T.GRAVEL);
  // Stone steps leading up
  fillRect(44,21,2,4,T.STONE_PATH);
  fillRect(46,20,2,6,T.STONE_PATH);
  fillRect(48,19,2,8,T.STONE_PATH);
  fillRect(50,18,14,10,T.STONE_PATH);
  // Shrine building
  fillRect(54,8,10,12,T.WOOD);
  fillRect(53,7,12,1,T.DARK_STONE);
  fillRect(53,19,12,1,T.DARK_STONE);
  fillRect(53,7,1,13,T.DARK_STONE);
  fillRect(65,7,1,13,T.DARK_STONE);
  // Stone garden
  fillRect(50,30,12,8,T.SAND);
  fillRect(52,32,3,2,T.STONE_PATH);
  fillRect(57,32,3,2,T.STONE_PATH);
  // Torii path
  fillRect(50,18,2,18,T.STONE_PATH);

  // ── ZONE 4: Demon Castle Approach (x:62–80) ──
  fillRect(62,0,18,MAP_H,T.DARK_STONE);
  // Lava cracks
  fillRect(64,5,2,8,T.LAVA);
  fillRect(70,15,1,6,T.LAVA);
  fillRect(72,35,2,5,T.LAVA);
  fillRect(66,38,1,4,T.LAVA);
  // Path to castle
  fillRect(62,21,18,4,T.STONE_PATH);
  // Castle interior
  fillRect(70,10,9,15,T.DARK_STONE);
  fillRect(71,11,7,13,T.WALL);
  // Broken walls
  fillRect(65,8,3,2,T.WALL);
  fillRect(68,30,4,3,T.WALL);
  fillRect(72,28,3,4,T.WALL);
  // Keep the outer path walkable
  fillRect(62,22,18,2,T.STONE_PATH);

  // Continuous horizontal path across all zones
  drawLineH(0,23,MAP_W,T.STONE_PATH);
}

// tile is solid (blocks movement)
function tileSolid(tx, ty) {
  const t = tileAt(tx,ty);
  return t===T.WALL || t===T.WATER || t===T.DEEP_WATER || t===T.LAVA;
}
function worldSolid(wx, wy) {
  const tx = Math.floor(wx/TILE);
  const ty = Math.floor(wy/TILE);
  return tileSolid(tx,ty);
}

// ─── GAME STATE ──────────────────────────────────────────────
const STATE = {INTRO:'intro',CUSTOMIZE:'customize',PLAYING:'playing',
               PAUSED:'paused',GAMEOVER:'gameover',WIN:'win'};
let gameState = STATE.INTRO;

// ─── PLAYER ──────────────────────────────────────────────────
const PLAYER_START_X = 3*TILE + 20;
const PLAYER_START_Y = 23*TILE + 12;
const player = {
  x: PLAYER_START_X, y: PLAYER_START_Y,
  r: 10, // radius for top-down circle
  angle: Math.PI/2, // facing direction (radians, down = PI/2)
  speed: 2.0,
  hp:100, maxHp:100,
  ki:100, maxKi:100,
  xp:0, xpNext:100, level:1,
  kills:0,
  str:1, def:1, spd:1, kiPow:1,
  attacking:false, attackTimer:0, attackAngle:0,
  kiAttacking:false, kiTimer:0,
  invincible:0,
  armorColor:'#8b0000', armorAccent:'#c9a84c',
  hairStyle:0, weapon:0, mon:0, skinTone:'#d4956a',
  walkFrame:0, walkTimer:0,
  alive:true,
  running: false,
  shadow: true,
};

// ─── CAMERA ──────────────────────────────────────────────────
const cam = { x:0, y:0 };

function updateCamera() {
  const tx = player.x - CW/2;
  const ty = player.y - CH/2;
  cam.x += (tx - cam.x) * 0.1;
  cam.y += (ty - cam.y) * 0.1;
  cam.x = Math.max(0, Math.min(WORLD_PX_W - CW, cam.x));
  cam.y = Math.max(0, Math.min(WORLD_PX_H - CH, cam.y));
}

// ─── KEYS ────────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => { keys[e.code]=true; onKey(e.code, e); });
window.addEventListener('keyup',   e => { keys[e.code]=false; });
canvas.addEventListener('click',   e => { onCanvasClick(e); });

function onKey(code, e) {
  if (gameState===STATE.PLAYING) {
    if (code==='Space') { e.preventDefault(); doAttack(); }
    if (code==='KeyQ')  doKiAttack();
    if (code==='KeyE')  interact();
    if (code==='Escape') togglePause();
  }
}
function onCanvasClick(e) {
  if (gameState===STATE.PLAYING) doAttack();
  if (gameState===STATE.CUSTOMIZE) handleCustomizeClick(e);
  if (gameState===STATE.INTRO) introSkip();
}

// ─── PARTICLES ───────────────────────────────────────────────
const particles = [];
function spawnParticles(x, y, color, count, speed, life) {
  for (let i=0;i<count;i++) {
    const ang = Math.random()*Math.PI*2;
    const spd = speed*(0.4+Math.random()*0.8);
    particles.push({
      x, y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd,
      color, alpha:1, life, maxLife:life,
      size: 2+Math.random()*3, rot:undefined
    });
  }
}
function spawnBlossoms(x, y, count) {
  for (let i=0;i<count;i++) {
    particles.push({
      x: x+Math.random()*60-30,
      y: y,
      vx:(Math.random()-0.5)*0.6,
      vy:Math.random()*0.4+0.1,
      color:`hsl(${330+Math.random()*30},80%,${70+Math.random()*20}%)`,
      alpha:0.85, life:220+Math.random()*100, maxLife:320,
      size:3+Math.random()*2, rot:Math.random()*Math.PI*2,
      rotSpd:(Math.random()-0.5)*0.06
    });
  }
}
function updateParticles() {
  for(let i=particles.length-1;i>=0;i--) {
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy;
    p.vy+=0.04;
    p.vx*=0.96;
    p.life--;
    p.alpha=p.life/p.maxLife;
    if(p.rot!==undefined) p.rot+=(p.rotSpd||0);
    if(p.life<=0) particles.splice(i,1);
  }
}

// ─── FLOATING TEXT ───────────────────────────────────────────
const floats = [];
function showFloatingText(x, y, text, color) {
  floats.push({ x, y:y-16, text, color, alpha:1, life:45 });
}
function updateFloats() {
  for(let i=floats.length-1;i>=0;i--) {
    const f=floats[i];
    f.y-=0.5; f.life--;
    f.alpha=f.life/45;
    if(f.life<=0) floats.splice(i,1);
  }
}

// ─── MESSAGES ────────────────────────────────────────────────
let msgTimeout;
function showMsg(text) {
  const box = document.getElementById('msgbox');
  box.textContent = text;
  box.style.opacity='1';
  clearTimeout(msgTimeout);
  msgTimeout = setTimeout(()=>{ box.style.opacity='0'; }, 2800);
}

// ─── SCENERY OBJECTS (placed in world) ───────────────────────
const sceneryObjects = [];
function buildScenery() {
  // Cherry blossom trees in village
  [[2,17],[3,27],[10,12],[20,12],[21,28],[23,28]].forEach(([tx,ty])=>{
    sceneryObjects.push({type:'cherry',wx:tx*TILE+20,wy:ty*TILE+20,r:18});
  });
  // Lanterns along paths
  for(let i=1;i<MAP_W-1;i+=4) {
    sceneryObjects.push({type:'lantern',wx:i*TILE+20,wy:23*TILE-8});
    sceneryObjects.push({type:'lantern',wx:i*TILE+20,wy:24*TILE+8});
  }
  // Torii gates at zone transitions and shrine
  [[23,22],[43,22],[59,18]].forEach(([tx,ty])=>{
    sceneryObjects.push({type:'torii',wx:tx*TILE,wy:ty*TILE});
  });
  // Rocks in mountain zone
  [[46,15],[48,12],[50,14],[55,28],[57,30],[60,20]].forEach(([tx,ty])=>{
    sceneryObjects.push({type:'rock',wx:tx*TILE+Math.random()*20,wy:ty*TILE+Math.random()*20,sc:0.6+Math.random()*0.7});
  });
  // Banners near guild (ally markers)
  [[10,21],[32,21],[56,20]].forEach(([tx,ty])=>{
    sceneryObjects.push({type:'banner',wx:tx*TILE,wy:ty*TILE});
  });
  // Bamboo clumps (additional foliage in bamboo zone)
  for(let y=0;y<MAP_H;y+=2) {
    for(let x=24;x<44;x+=3) {
      if(tileAt(x,y)===T.BAMBOO) {
        sceneryObjects.push({type:'bamboo',wx:x*TILE+Math.random()*TILE,wy:y*TILE+Math.random()*TILE});
      }
    }
  }
  // Demon castle building
  sceneryObjects.push({type:'castle',wx:70*TILE,wy:10*TILE});
  // Shrine building
  sceneryObjects.push({type:'shrine',wx:54*TILE,wy:8*TILE});
  // Pond lily pads
  for(let i=0;i<5;i++) {
    sceneryObjects.push({type:'lily',wx:2*TILE+Math.random()*2*TILE,wy:14*TILE+Math.random()*5*TILE});
  }
}

// ─── ENEMY SYSTEM ────────────────────────────────────────────
const ENEMY_STATE = {PATROL:'patrol',ALERT:'alert',CHASE:'chase',ATTACK:'attack',SEARCH:'search',RETURN:'return'};
const enemies = [];

function spawnEnemies() {
  // 20 samurai soldiers across map
  const samuraiDefs = [

    {x:20*TILE,y:20*TILE,wp:[[20*TILE,20*TILE],[22*TILE,20*TILE]]},

    {x:16*TILE,y:23*TILE,wp:[[14*TILE,23*TILE],[19*TILE,23*TILE]]},
    // bamboo zone
    {x:26*TILE,y:23*TILE,wp:[[25*TILE,23*TILE],[29*TILE,23*TILE]]},
    {x:30*TILE,y:22*TILE,wp:[[28*TILE,22*TILE],[33*TILE,22*TILE]]},
    {x:34*TILE,y:23*TILE,wp:[[32*TILE,23*TILE],[37*TILE,23*TILE]]},
    {x:38*TILE,y:22*TILE,wp:[[36*TILE,22*TILE],[41*TILE,22*TILE]]},
    {x:28*TILE,y:12*TILE,wp:[[27*TILE,12*TILE],[31*TILE,12*TILE]]},
    {x:36*TILE,y:33*TILE,wp:[[35*TILE,33*TILE],[39*TILE,33*TILE]]},
    // mountain zone
    {x:46*TILE,y:23*TILE,wp:[[45*TILE,23*TILE],[49*TILE,23*TILE]]},
    {x:50*TILE,y:22*TILE,wp:[[49*TILE,22*TILE],[53*TILE,22*TILE]]},

  const demonDefs = [
    {x:63*TILE,y:18*TILE,wp:[[62*TILE,18*TILE],[65*TILE,18*TILE]]},
    {x:65*TILE,y:26*TILE,wp:[[64*TILE,26*TILE],[68*TILE,26*TILE]]},

  // Boss
  enemies.push(createEnemy('boss',75*TILE,22*TILE,3,[[74*TILE,22*TILE],[77*TILE,22*TILE]]));
}

function createEnemy(type, x, y, tier, waypoints) {
  const tiers=[
    {hp:30,str:5,def:1,speed:0.9,xp:20},
    {hp:55,str:9,def:2,speed:1.1,xp:40},
    {hp:90,str:14,def:3,speed:1.3,xp:80},
    {hp:280,str:22,def:6,speed:1.0,xp:300},
  ];
  const t = tiers[Math.min(tier,3)];
  const isDemon = type==='demon'||type==='boss';
  return {
    type, x, y, r:11,
    angle: Math.random()*Math.PI*2,
    hp:t.hp, maxHp:t.hp,
    str:t.str, def:t.def, speed:t.speed, xp:t.xp,
    tier, alive:true,
    state:ENEMY_STATE.PATROL,
    stateTimer:0,
    waypoints: waypoints||[[x,y]],
    wpIdx:0,
    startX:x, startY:y,
    attackTimer:0,
    attackCooldown:80,
    hitTimer:0,
    walkFrame:0, walkTimer:0,
    isBoss:type==='boss',
    phase:1, specialTimer:0,
    // sight / hearing
    sightRange: isDemon ? 150 : 130,
    sightAngle: isDemon ? (Math.PI*5/6) : (Math.PI*2/3), // 150° or 120°
    hearRange: isDemon ? 0 : 60,
    // alert state last pos
    lastSeenX:x, lastSeenY:y,
    // colors
    color: type==='boss' ? '#1a0022' : type==='demon'
           ? ['#6a0a0a','#450045','#003055'][tier%3]
           : ['#334488','#aa3333','#336633','#886622'][tier%4],
    accentColor: type==='boss' ? '#9900cc' : type==='demon' ? '#cc0000' : '#c9a84c',
  };
}

// sight cone check
function canSeePlayer(e) {
  const dx = player.x - e.x;
  const dy = player.y - e.y;
  const dist = Math.sqrt(dx*dx+dy*dy);
  if (dist > e.sightRange) return false;
  const angleToPlayer = Math.atan2(dy, dx);
  let diff = angleToPlayer - e.angle;
  while(diff>Math.PI) diff-=Math.PI*2;
  while(diff<-Math.PI) diff+=Math.PI*2;
  if (Math.abs(diff) > e.sightAngle/2) return false;
  // simple LOS: check a few points along the line
  for(let t=0.2;t<1.0;t+=0.2) {
    const wx = e.x + dx*t;
    const wy = e.y + dy*t;
    if (worldSolid(wx,wy)) return false;
  }
  return true;
}

function canHearPlayer(e) {
  if (e.hearRange===0) return false;
  if (!player.running) return false;
  const dx=player.x-e.x, dy=player.y-e.y;
  return (dx*dx+dy*dy) < e.hearRange*e.hearRange;
}

function updateEnemies() {
  enemies.forEach(e=>{
    if(!e.alive) return;
    if(e.hitTimer>0) e.hitTimer--;
    if(e.attackTimer>0) e.attackTimer--;
    e.walkTimer++;
    if(e.walkTimer>6){e.walkTimer=0;e.walkFrame++;}

    if(e.isBoss) { updateBoss(e); return; }

    switch(e.state) {
      case ENEMY_STATE.PATROL: doPatrol(e); break;
      case ENEMY_STATE.ALERT:  doAlert(e);  break;
      case ENEMY_STATE.CHASE:  doChase(e);  break;
      case ENEMY_STATE.ATTACK: doAttackEnemy(e); break;
      case ENEMY_STATE.SEARCH: doSearch(e); break;
      case ENEMY_STATE.RETURN: doReturn(e); break;
    }
  });
}

function doPatrol(e) {
  const see = canSeePlayer(e);
  const hear = canHearPlayer(e);
  if (see || hear) {
    e.state = ENEMY_STATE.ALERT;
    e.stateTimer = 90;
    return;
  }
  // Move toward current waypoint
  const wp = e.waypoints[e.wpIdx];
  const dx = wp[0]-e.x, dy = wp[1]-e.y;
  const dist = Math.sqrt(dx*dx+dy*dy);
  if (dist < 8) {
    e.wpIdx = (e.wpIdx+1) % e.waypoints.length;
  } else {
    const spd = e.speed*0.5;
    e.x += (dx/dist)*spd;
    e.y += (dy/dist)*spd;
    e.angle = Math.atan2(dy,dx);
  }
}

function doAlert(e) {
  e.stateTimer--;
  const see = canSeePlayer(e);
  if (see) {
    e.lastSeenX = player.x; e.lastSeenY = player.y;
    e.stateTimer = 90; // keep alerting while still seeing
  }
  if (e.stateTimer<=0) {
    if (see) { e.state=ENEMY_STATE.CHASE; }
    else { e.state=ENEMY_STATE.PATROL; }
  }
}

function doChase(e) {
  const see = canSeePlayer(e);
  if (see) {
    e.lastSeenX = player.x; e.lastSeenY = player.y;
  } else {
    e.state = ENEMY_STATE.SEARCH;
    e.stateTimer = 60;
    return;
  }
  const dx=player.x-e.x, dy=player.y-e.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  const attackR = 32;
  if (dist < attackR) {
    e.state=ENEMY_STATE.ATTACK;
    e.attackTimer = e.attackCooldown;
  } else {
    e.x += (dx/dist)*e.speed;
    e.y += (dy/dist)*e.speed;
    e.angle = Math.atan2(dy,dx);
  }
}

function doAttackEnemy(e) {
  const dx=player.x-e.x, dy=player.y-e.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  e.angle=Math.atan2(dy,dx);
  if (dist > 38) { e.state=ENEMY_STATE.CHASE; return; }
  if (e.attackTimer<=0) {
    e.attackTimer = e.attackCooldown;
    dealEnemyAttack(e);
  }
  if (!canSeePlayer(e)) { e.state=ENEMY_STATE.SEARCH; e.stateTimer=60; }
}

function doSearch(e) {
  e.stateTimer--;
  // Walk toward last seen position
  const dx=e.lastSeenX-e.x, dy=e.lastSeenY-e.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if (dist>8) {
    e.x+=(dx/dist)*e.speed*0.6;
    e.y+=(dy/dist)*e.speed*0.6;
    e.angle=Math.atan2(dy,dx);
  }
  if (canSeePlayer(e)) { e.state=ENEMY_STATE.CHASE; return; }
  if (e.stateTimer<=0) { e.state=ENEMY_STATE.RETURN; }
}

function doReturn(e) {
  const dx=e.startX-e.x, dy=e.startY-e.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if (dist<8) { e.state=ENEMY_STATE.PATROL; return; }
  e.x+=(dx/dist)*e.speed*0.5;
  e.y+=(dy/dist)*e.speed*0.5;
  e.angle=Math.atan2(dy,dx);
  if (canSeePlayer(e)) { e.state=ENEMY_STATE.ALERT; e.stateTimer=90; }
}

function updateBoss(e) {
  if(e.hp<e.maxHp/2) e.phase=2;
  const spd = e.speed*(e.phase===2?1.5:1);
  const dx=player.x-e.x, dy=player.y-e.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<350) {
    e.angle=Math.atan2(dy,dx);
    if(dist>40) { e.x+=(dx/dist)*spd; e.y+=(dy/dist)*spd; }
    if(e.attackTimer<=0) {
      e.attackTimer=e.phase===2?40:65;
      dealEnemyAttack(e);
      if(e.phase===2) {
        const ang=Math.atan2(dy,dx);
        for(let a=-0.3;a<=0.3;a+=0.3) {
          projectiles.push({x:e.x,y:e.y,vx:Math.cos(ang+a)*5,vy:Math.sin(ang+a)*5,
            owner:'enemy',dmg:12,life:100,color:'#9900cc',size:10});
        }
      }
    }
    e.specialTimer++;
    if(e.specialTimer>200){e.specialTimer=0;spawnParticles(e.x,e.y,'#9900cc',30,6,60);}
  }
}

const allies = [];
function spawnAllies() {
  [[10*TILE+20, 21*TILE+20],[32*TILE+20,21*TILE+20],[56*TILE+20,20*TILE+20]].forEach(([ax,ay])=>{
    allies.push({

      angle:0,
      color:'#336655',accentColor:'#88ffcc',
      hp:80,maxHp:80,alive:true,
      speed:1.3,
      attackTimer:0,
      walkFrame:0,walkTimer:0,
      hitTimer:0,
    });
  });
}

function updateAllies() {
  allies.forEach(a=>{
    if(!a.alive) return;
    if(a.attackTimer>0) a.attackTimer--;
    a.walkTimer++;
    if(a.walkTimer>7){a.walkTimer=0;a.walkFrame++;}
    let nearest=null,nearDist=Infinity;
    enemies.forEach(e=>{
      if(!e.alive) return;
      const d=Math.hypot(e.x-a.x,e.y-a.y);
      if(d<nearDist){nearDist=d;nearest=e;}
    });
    if(nearest&&nearDist<200) {
      const dx=nearest.x-a.x,dy=nearest.y-a.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      a.angle=Math.atan2(dy,dx);
      if(dist>36) { a.x+=(dx/dist)*a.speed; a.y+=(dy/dist)*a.speed; }
      if(dist<44&&a.attackTimer<=0) {
        a.attackTimer=70;
        const dmg=8+Math.floor(Math.random()*5);
        nearest.hp-=dmg;
        nearest.hitTimer=14;
        spawnParticles(nearest.x,nearest.y,'#88ffcc',5,2,20);
        if(nearest.hp<=0) killEnemy(nearest);
      }
    }
  });
}

// ─── PROJECTILES ─────────────────────────────────────────────
const projectiles = [];

// ─── COMBAT ──────────────────────────────────────────────────
function doAttack() {
  if(!player.alive||player.attacking) return;
  player.attacking=true;
  player.attackTimer=22;
  player.attackAngle=player.angle;
  setTimeout(()=>dealAttack(),90);
}

function dealAttack() {
  if(!player.alive) return;
  const reach = player.weapon===1?55:player.weapon===2?62:38;
  const sweep = Math.PI*0.6;
  enemies.forEach(e=>{
    if(!e.alive) return;
    const dx=e.x-player.x, dy=e.y-player.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>reach+e.r) return;
    let ang=Math.atan2(dy,dx);
    let diff=ang-player.attackAngle;
    while(diff>Math.PI) diff-=Math.PI*2;
    while(diff<-Math.PI) diff+=Math.PI*2;
    if(Math.abs(diff)>sweep/2) return;
    const dmg=Math.max(1,(player.str*3+2)-e.def+Math.floor(Math.random()*4));
    e.hp-=dmg; e.hitTimer=18;
    spawnParticles(e.x,e.y,'#cc2200',8,3,30);
    showFloatingText(e.x,e.y-10,`-${dmg}`,'#ff4444');
    if(e.state===ENEMY_STATE.PATROL||e.state===ENEMY_STATE.ALERT) {
      e.state=ENEMY_STATE.CHASE;
    }
    if(e.hp<=0) killEnemy(e);
  });
}

function doKiAttack() {
  if(!player.alive||player.ki<20) return;
  player.ki-=20; updateHUD();
  player.kiAttacking=true; player.kiTimer=20;
  spawnParticles(player.x,player.y,'#4488ff',20,5,40);
  projectiles.push({
    x:player.x,y:player.y,
    vx:Math.cos(player.angle)*(7+player.kiPow*0.5),
    vy:Math.sin(player.angle)*(7+player.kiPow*0.5),
    owner:'player',dmg:12+player.kiPow*4,
    life:70,color:'#44aaff',size:10
  });
}

function killEnemy(e) {
  e.alive=false; e.hp=0;
  player.kills++; gainXP(e.xp);
  spawnParticles(e.x,e.y,e.type==='demon'?'#880000':'#cc3300',20,4,50);
  showMsg(e.isBoss?'⚔ Dämonenlord besiegt! Rōnin triumphiert!':
    e.type==='demon'?'鬼 Dämon vernichtet!':'侍 Samurai besiegt!');
  if(e.isBoss) setTimeout(()=>{gameState=STATE.WIN;},1500);
  updateStats();
}

function dealEnemyAttack(e) {
  if(!player.alive||player.invincible>0) return;
  const dx=Math.abs(player.x-e.x),dy=Math.abs(player.y-e.y);
  if(dx<50&&dy<50) {
    const dmg=Math.max(1,e.str-Math.floor(player.def*0.5)+Math.floor(Math.random()*3));
    player.hp-=dmg; player.invincible=45;
    spawnParticles(player.x,player.y,'#ff2200',10,3,25);
    showFloatingText(player.x,player.y-10,`-${dmg}`,'#ff6666');
    updateHUD();
    if(player.hp<=0){player.alive=false;player.hp=0;updateHUD();gameState=STATE.GAMEOVER;}
  }
}

function interact() {
  allies.forEach(a=>{
    if(Math.hypot(a.x-player.x,a.y-player.y)<80) {
      player.hp=Math.min(player.maxHp,player.hp+20);
      player.ki=Math.min(player.maxKi,player.ki+15);
      updateHUD();
      showMsg('⚔ Verbündeter heilt dich!');
      spawnParticles(player.x,player.y,'#88ffcc',15,3,40);
    }
  });
  // shrine interaction
  sceneryObjects.forEach(s=>{
    if(s.type==='shrine'&&Math.hypot(s.wx-player.x,s.wy-player.y)<80){
      player.hp=Math.min(player.maxHp,player.hp+30);
      player.ki=Math.min(player.maxKi,player.ki+30);
      updateHUD();
      showMsg('⛩ Schrein gibt Kraft!');
      spawnParticles(player.x,player.y,'#ffd700',20,4,50);
    }
  });
}

function gainXP(amount) {
  player.xp+=amount;
  if(player.xp>=player.xpNext) {
    player.xp-=player.xpNext;
    player.level++;
    player.xpNext=Math.floor(player.xpNext*1.6);
    levelUp();
  }
  updateHUD();
}

function levelUp() {
  player.str+=1+Math.floor(player.level/3);
  player.def+=1;
  player.spd+=0.3;
  player.kiPow+=1;
  player.maxHp+=15; player.hp=player.maxHp;
  player.maxKi+=8;  player.ki=player.maxKi;
  player.speed=2.0+player.spd*0.12;
  showMsg(`✦ STUFE ${player.level}! Stärke +${1+Math.floor(player.level/3)}`);
  const flash=document.getElementById('level-up-flash');
  flash.style.opacity='1';
  setTimeout(()=>{flash.style.opacity='0';},400);
  spawnParticles(player.x,player.y,'#ffdd00',40,4,60);
  updateStats(); updateHUD();
}

function updateHUD() {
  document.getElementById('hp-fill').style.width=(player.hp/player.maxHp*100)+'%';
  document.getElementById('ki-fill').style.width=(player.ki/player.maxKi*100)+'%';
  document.getElementById('xp-fill').style.width=(player.xp/player.xpNext*100)+'%';
}
function updateStats() {
  document.getElementById('stat-str').textContent =`Stärke:   ${player.str}`;
  document.getElementById('stat-def').textContent =`Verteidigung: ${player.def}`;
  document.getElementById('stat-spd').textContent =`Geschwindigkeit: ${Math.round(player.spd*10)/10}`;
  document.getElementById('stat-ki').textContent  =`Ki-Kraft:  ${player.kiPow}`;
  document.getElementById('stat-lvl').textContent =`Stufe: ${player.level}`;
  document.getElementById('stat-kills').textContent=`Besiegte: ${player.kills}`;
}

function updateProjectiles() {
  for(let i=projectiles.length-1;i>=0;i--) {
    const p=projectiles[i];
    p.x+=p.vx; p.y+=p.vy;
    p.life--;
    if(p.life<=0){projectiles.splice(i,1);continue;}
    if(worldSolid(p.x,p.y)){spawnParticles(p.x,p.y,p.color,4,2,15);projectiles.splice(i,1);continue;}
    if(p.owner==='player') {
      enemies.forEach(e=>{
        if(!e.alive) return;
        if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+p.size/2) {
          e.hp-=p.dmg; e.hitTimer=18;
          spawnParticles(e.x,e.y,'#4488ff',12,3,30);
          showFloatingText(e.x,e.y-10,`-${p.dmg}`,'#44aaff');
          if(e.hp<=0) killEnemy(e);
          else if(e.state===ENEMY_STATE.PATROL) {e.state=ENEMY_STATE.ALERT;e.stateTimer=90;}
          p.life=0;
        }
      });
    } else {
      if(!player.alive||player.invincible>0) continue;
      if(Math.hypot(player.x-p.x,player.y-p.y)<player.r+p.size/2) {
        player.hp-=p.dmg; player.invincible=50;
        showFloatingText(player.x,player.y-10,`-${p.dmg}`,'#ff6666');
        updateHUD();
        if(player.hp<=0){player.alive=false;player.hp=0;updateHUD();gameState=STATE.GAMEOVER;}
        p.life=0;
      }
    }
  }
}

// ─── PLAYER UPDATE ───────────────────────────────────────────
function updatePlayer() {
  if(!player.alive) return;
  let dx=0,dy=0;
  if(keys['KeyA']||keys['ArrowLeft'])  dx-=1;
  if(keys['KeyD']||keys['ArrowRight']) dx+=1;
  if(keys['KeyW']||keys['ArrowUp'])    dy-=1;
  if(keys['KeyS']||keys['ArrowDown'])  dy+=1;
  const moving = dx!==0||dy!==0;
  player.running = moving && (keys['ShiftLeft']||keys['ShiftRight']);
  const spd = player.speed * (player.running ? 1.7 : 1.0);

  if(moving) {
    const len=Math.sqrt(dx*dx+dy*dy);
    const nx=dx/len, ny=dy/len;
    const nx2=nx*spd, ny2=ny*spd;
    // Collision: try X then Y
    const nx_new = player.x+nx2;
    const ny_new = player.y+ny2;
    const r=player.r-2;
    if(!worldSolid(nx_new+r*Math.sign(nx2),player.y)||(!worldSolid(nx_new-r*Math.sign(nx2),player.y)&&nx2===0)) {
      if(!tileSolid(Math.floor((nx_new+(nx2>=0?r:-r))/TILE),Math.floor(player.y/TILE))
       &&!tileSolid(Math.floor((nx_new+(nx2>=0?r:-r))/TILE),Math.floor((player.y-r)/TILE))
       &&!tileSolid(Math.floor((nx_new+(nx2>=0?r:-r))/TILE),Math.floor((player.y+r)/TILE))) {
        player.x=nx_new;
      }
    } else { player.x=nx_new; }
    // simpler: just try moving and check corners
    const cx=player.x, cy=player.y;
    let newx=cx+nx2, newy=cy+ny2;
    // X collision
    if(tileSolid(Math.floor((newx+(nx2>0?r:-r))/TILE),Math.floor(cy/TILE))||
       tileSolid(Math.floor((newx+(nx2>0?r:-r))/TILE),Math.floor((cy-r)/TILE))||
       tileSolid(Math.floor((newx+(nx2>0?r:-r))/TILE),Math.floor((cy+r)/TILE))) {
      newx=cx;
    }
    // Y collision
    if(tileSolid(Math.floor(newx/TILE),Math.floor((newy+(ny2>0?r:-r))/TILE))||
       tileSolid(Math.floor((newx-r)/TILE),Math.floor((newy+(ny2>0?r:-r))/TILE))||
       tileSolid(Math.floor((newx+r)/TILE),Math.floor((newy+(ny2>0?r:-r))/TILE))) {
      newy=cy;
    }
    player.x=Math.max(r,Math.min(WORLD_PX_W-r,newx));
    player.y=Math.max(r,Math.min(WORLD_PX_H-r,newy));
    player.angle=Math.atan2(ny,nx);
    player.walkTimer++;
    if(player.walkTimer>5){player.walkTimer=0;player.walkFrame++;}
  } else {
    player.walkFrame=0;
  }

  if(player.attacking){player.attackTimer--;if(player.attackTimer<=0)player.attacking=false;}
  if(player.kiAttacking){player.kiTimer--;if(player.kiTimer<=0)player.kiAttacking=false;}
  if(player.invincible>0) player.invincible--;
  if(player.ki<player.maxKi){player.ki+=0.04;updateHUD();}
}

// ─── DRAWING — TILE MAP ──────────────────────────────────────
const tileCache = {}; // offscreen canvas per tile type

function getTileCanvas(type) {
  if(tileCache[type]) return tileCache[type];
  const oc=document.createElement('canvas');
  oc.width=TILE; oc.height=TILE;
  const octx=oc.getContext('2d');
  const colors=TILE_COLORS[type]||['#444'];
  octx.fillStyle=colors[0];
  octx.fillRect(0,0,TILE,TILE);
  // Variations
  for(let i=0;i<8;i++) {
    const c=colors[Math.floor(Math.random()*colors.length)];
    octx.fillStyle=c;
    const rx=Math.random()*TILE,ry=Math.random()*TILE,rw=4+Math.random()*8,rh=4+Math.random()*8;
    octx.fillRect(rx,ry,rw,rh);
  }
  // Lines / details
  if(type===T.WOOD) {
    octx.strokeStyle='rgba(0,0,0,0.15)';
    octx.lineWidth=1;
    for(let lx=0;lx<TILE;lx+=6){
      octx.beginPath();octx.moveTo(lx,0);octx.lineTo(lx,TILE);octx.stroke();
    }
  }
  if(type===T.STONE_PATH) {
    octx.strokeStyle='rgba(0,0,0,0.12)';
    octx.lineWidth=1;
    octx.beginPath();
    octx.moveTo(TILE/2,0);octx.lineTo(TILE/2,TILE);
    octx.moveTo(0,TILE/2);octx.lineTo(TILE,TILE/2);
    octx.stroke();
  }
  if(type===T.BAMBOO) {
    octx.strokeStyle='rgba(30,80,10,0.4)';
    octx.lineWidth=2;
    for(let bx=4;bx<TILE;bx+=8){
      octx.beginPath();octx.moveTo(bx,0);octx.lineTo(bx,TILE);octx.stroke();
    }
  }
  tileCache[type]=oc;
  return oc;
}

let waterAnim=0;
function drawTiles() {
  const startTX = Math.max(0,Math.floor(cam.x/TILE));
  const startTY = Math.max(0,Math.floor(cam.y/TILE));
  const endTX   = Math.min(MAP_W, startTX+Math.ceil(CW/TILE)+2);
  const endTY   = Math.min(MAP_H, startTY+Math.ceil(CH/TILE)+2);

  for(let ty=startTY;ty<endTY;ty++) {
    for(let tx=startTX;tx<endTX;tx++) {
      const type=tileAt(tx,ty);
      const sx=tx*TILE-cam.x, sy=ty*TILE-cam.y;

      if(type===T.WATER||type===T.DEEP_WATER) {
        // Animated water
        const base=type===T.DEEP_WATER?'#0a2a4a':'#1a4a7a';
        ctx.fillStyle=base;
        ctx.fillRect(sx,sy,TILE,TILE);
        // shimmer
        ctx.save();
        ctx.globalAlpha=0.18+Math.sin(waterAnim*0.05+tx*0.7+ty*0.5)*0.12;
        ctx.fillStyle='#4a9aee';
        ctx.fillRect(sx,sy,TILE,TILE);
        ctx.restore();
        // wave lines
        ctx.save();
        ctx.globalAlpha=0.25;
        ctx.strokeStyle='#6abaff';
        ctx.lineWidth=1;
        for(let wy=0;wy<TILE;wy+=6) {
          ctx.beginPath();
          const offset=Math.sin(waterAnim*0.08+tx+wy)*3;
          ctx.moveTo(sx,sy+wy+offset);
          ctx.lineTo(sx+TILE,sy+wy+Math.sin(waterAnim*0.08+tx+wy+1)*3);
          ctx.stroke();
        }
        ctx.restore();
      } else if(type===T.LAVA) {
        ctx.fillStyle='#330800';
        ctx.fillRect(sx,sy,TILE,TILE);
        ctx.save();
        ctx.globalAlpha=0.5+Math.sin(waterAnim*0.1+tx*0.8+ty)*0.3;
        ctx.fillStyle=`hsl(${15+Math.sin(waterAnim*0.07+tx)*10},90%,40%)`;
        ctx.fillRect(sx+4,sy+4,TILE-8,TILE-8);
        ctx.restore();
      } else {
        ctx.drawImage(getTileCanvas(type),sx,sy);
      }

      // Tile border shadow for depth
      if(type===T.WALL||type===T.DARK_STONE) {
        ctx.save();
        ctx.globalAlpha=0.3;
        ctx.fillStyle='#000';
        ctx.fillRect(sx,sy,TILE,3);
        ctx.fillRect(sx,sy,3,TILE);
        ctx.restore();
      }
    }
  }
}

// ─── DRAWING — TOP-DOWN CHARACTERS ───────────────────────────
// Helper: draw a top-down character circle with head + body
function drawTopDownChar(cx, cy, angle, r, bodyColor, headColor, accentColor, walkFrame, shadow) {
  // Shadow
  if(shadow) {
    ctx.save();
    ctx.globalAlpha=0.35;
    ctx.fillStyle='#000';
    ctx.beginPath();
    ctx.ellipse(cx+3,cy+4,r*0.9,r*0.6,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  // Body circle
  ctx.fillStyle=bodyColor;
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fill();
  // Armor detail ring
  ctx.strokeStyle=accentColor;
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.arc(cx,cy,r-2,0,Math.PI*2);
  ctx.stroke();
  // Head (smaller, in facing direction)
  const hx=cx+Math.cos(angle)*(r*0.45);
  const hy=cy+Math.sin(angle)*(r*0.45);
  ctx.fillStyle=headColor;
  ctx.beginPath();
  ctx.arc(hx,hy,r*0.48,0,Math.PI*2);
  ctx.fill();
  // Walking legs (two dots at opposite swing)
  const legDist=r*0.5;
  const perpAng=angle+Math.PI/2;
  const legSwing=Math.sin(walkFrame*0.5)*r*0.25;
  const l1x=cx+Math.cos(perpAng)*legSwing+Math.cos(angle+Math.PI)*legDist*0.6;
  const l1y=cy+Math.sin(perpAng)*legSwing+Math.sin(angle+Math.PI)*legDist*0.6;
  const l2x=cx-Math.cos(perpAng)*legSwing+Math.cos(angle+Math.PI)*legDist*0.6;
  const l2y=cy-Math.sin(perpAng)*legSwing+Math.sin(angle+Math.PI)*legDist*0.6;
  ctx.fillStyle=darken(bodyColor,0.7);
  ctx.beginPath(); ctx.arc(l1x,l1y,r*0.22,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(l2x,l2y,r*0.22,0,Math.PI*2); ctx.fill();
}

function drawPlayer(cx, cy) {
  if(!player.alive) return;
  if(player.invincible>0&&Math.floor(player.invincible/4)%2===0) return;

  // Determine head color from hair style
  const headColors=['#1a0a00','#1a0a00','#d4956a','#cc2200'];
  const headCol=headColors[player.hairStyle]||'#1a0a00';

  drawTopDownChar(cx,cy,player.angle,player.r,
    player.armorColor,headCol,player.armorAccent,player.walkFrame,true);

  // Weapon arc during attack
  if(player.attacking) {
    const progress=1-(player.attackTimer/22);
    const sweepStart=player.attackAngle-Math.PI*0.35;
    const sweepEnd=player.attackAngle+Math.PI*0.35;
    const reach=player.weapon===1?55:player.weapon===2?62:38;
    ctx.save();
    ctx.globalAlpha=0.4*(1-progress);
    ctx.strokeStyle=player.armorAccent;
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(cx,cy,reach,sweepStart,sweepEnd);
    ctx.stroke();
    // Blade glint
    ctx.globalAlpha=0.7*(1-progress);
    ctx.strokeStyle='#ffffff';
    ctx.lineWidth=1;
    ctx.stroke();
    ctx.restore();
  }
  // Ki aura
  if(player.kiAttacking) {
    ctx.save();
    ctx.globalAlpha=player.kiTimer/20*0.6;
    ctx.strokeStyle='#4488ff';
    ctx.lineWidth=4;
    ctx.shadowColor='#4488ff';
    ctx.shadowBlur=12;
    ctx.beginPath();
    ctx.arc(cx,cy,player.r+8,0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
  // Mon (clan symbol) on body
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(player.angle+Math.PI/2);
  drawMon(0,0,4,player.mon,player.armorAccent);
  ctx.restore();
}

function drawEnemy(e, scx, scy) {
  if(!e.alive) return;
  // Hit flash
  if(e.hitTimer>0&&Math.floor(e.hitTimer/3)%2===0) {
    ctx.save(); ctx.filter='brightness(3)';
  }
  const headCol=e.type==='samurai'?darken(e.color,0.6):'#220000';
  drawTopDownChar(scx,scy,e.angle,e.r,e.color,headCol,e.accentColor,e.walkFrame,true);
  if(e.hitTimer>0&&Math.floor(e.hitTimer/3)%2===0) ctx.restore();

  // Boss aura
  if(e.isBoss) {
    ctx.save();
    ctx.globalAlpha=0.2+Math.sin(Date.now()/300)*0.1;
    ctx.strokeStyle='#9900cc';
    ctx.lineWidth=4;
    ctx.shadowColor='#9900cc'; ctx.shadowBlur=15;
    ctx.beginPath(); ctx.arc(scx,scy,e.r+10,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  // Demon horns (dots above head)
  if(e.type==='demon'||e.isBoss) {
    const ha=e.angle-Math.PI/2;
    const hx=scx+Math.cos(e.angle)*e.r*0.45;
    const hy=scy+Math.sin(e.angle)*e.r*0.45;
    ctx.fillStyle=e.isBoss?'#9900cc':'#cc0000';
    ctx.beginPath(); ctx.arc(hx+Math.cos(ha)*4,hy+Math.sin(ha)*4,3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(hx-Math.cos(ha)*4,hy-Math.sin(ha)*4,3,0,Math.PI*2); ctx.fill();
  }

  // HP bar
  const hpPct=e.hp/e.maxHp;
  ctx.globalAlpha=0.85;
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.fillRect(scx-18,scy-e.r-14,36,5);
  ctx.fillStyle=hpPct>0.5?'#44cc44':hpPct>0.25?'#ffaa00':'#cc2200';
  ctx.fillRect(scx-18,scy-e.r-14,36*hpPct,5);
  ctx.globalAlpha=1;

  // State indicator
  if(e.state===ENEMY_STATE.ALERT) {
    ctx.save();
    ctx.fillStyle='#ffee00';
    ctx.font='bold 12px Georgia';
    ctx.textAlign='center';
    ctx.fillText('?',scx,scy-e.r-18);
    ctx.restore();
  } else if(e.state===ENEMY_STATE.CHASE||e.state===ENEMY_STATE.ATTACK) {
    ctx.save();
    ctx.fillStyle='#ff3300';
    ctx.font='bold 12px Georgia';
    ctx.textAlign='center';
    ctx.fillText('!',scx,scy-e.r-18);
    ctx.restore();
  }

  // Sight cone
  drawSightCone(e, scx, scy);
}

function drawSightCone(e, scx, scy) {
  let coneColor, coneAlpha;
  if(e.state===ENEMY_STATE.PATROL||e.state===ENEMY_STATE.RETURN) {
    coneColor='rgba(255,255,100,'; coneAlpha=0.06;
  } else if(e.state===ENEMY_STATE.ALERT||e.state===ENEMY_STATE.SEARCH) {
    coneColor='rgba(255,220,0,'; coneAlpha=0.12;
  } else {
    coneColor='rgba(255,50,0,'; coneAlpha=0.15;
  }
  ctx.save();
  ctx.globalAlpha=coneAlpha;
  ctx.fillStyle=coneColor+1+')';
  ctx.beginPath();
  ctx.moveTo(scx,scy);
  const halfAngle=e.sightAngle/2;
  const steps=12;
  for(let i=0;i<=steps;i++) {
    const a=e.angle-halfAngle+i*(e.sightAngle/steps);
    ctx.lineTo(scx+Math.cos(a)*e.sightRange, scy+Math.sin(a)*e.sightRange);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawAlly(a, scx, scy) {
  if(!a.alive) return;
  drawTopDownChar(scx,scy,a.angle,a.r,a.color,'#4a8a6a',a.accentColor,a.walkFrame,true);
  // ally HP
  const hpPct=a.hp/a.maxHp;
  ctx.globalAlpha=0.7;
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.fillRect(scx-14,scy-a.r-12,28,4);
  ctx.fillStyle='#44ff88';
  ctx.fillRect(scx-14,scy-a.r-12,28*hpPct,4);
  ctx.globalAlpha=1;
}

// ─── DRAWING — SCENERY ───────────────────────────────────────
function drawCherryTree(sx, sy) {
  // Shadow
  ctx.save();
  ctx.globalAlpha=0.3;
  ctx.fillStyle='#000';
  ctx.beginPath();
  ctx.ellipse(sx+4,sy+4,16,10,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
  // Trunk (small dot from above)
  ctx.fillStyle='#3a2010';
  ctx.beginPath(); ctx.arc(sx,sy,4,0,Math.PI*2); ctx.fill();
  // Canopy circles (cherry blossoms from above = pink/magenta clusters)
  const t=Date.now()/3000;
  const mainR=18;
  [[0,0],[mainR*0.5,-mainR*0.4],[-mainR*0.5,-mainR*0.3],[mainR*0.3,mainR*0.4],[-mainR*0.3,mainR*0.3]].forEach(([ox,oy],i)=>{
    const hue=330+Math.sin(t+i)*8;
    const lit=55+Math.cos(t+i)*5;
    ctx.fillStyle=`hsl(${hue},75%,${lit}%)`;
    ctx.beginPath();
    ctx.arc(sx+ox,sy+oy,mainR*0.6,0,Math.PI*2);
    ctx.fill();
  });
  // Highlights
  ctx.save();
  ctx.globalAlpha=0.4;
  ctx.fillStyle='#ffddee';
  ctx.beginPath(); ctx.arc(sx-4,sy-4,6,0,Math.PI*2); ctx.fill();
  ctx.restore();
  // Spawn petals
  if(Math.random()<0.005) spawnBlossoms(sx+cam.x,sy+cam.y,2);
}

function drawLanternTop(sx, sy) {
  // Lantern from above: pole + glowing circle
  const grd=ctx.createRadialGradient(sx,sy,2,sx,sy,24);
  grd.addColorStop(0,'rgba(255,180,50,0.55)');
  grd.addColorStop(1,'rgba(255,140,20,0)');
  ctx.fillStyle=grd;
  ctx.beginPath(); ctx.arc(sx,sy,24,0,Math.PI*2); ctx.fill();
  // Pole
  ctx.fillStyle='#5a3010';
  ctx.beginPath(); ctx.arc(sx,sy,3,0,Math.PI*2); ctx.fill();
  // Lantern body
  const flicker=0.7+Math.sin(Date.now()/350)*0.2;
  ctx.fillStyle=`rgba(255,${Math.floor(140+flicker*30)},40,${flicker})`;
  ctx.beginPath(); ctx.arc(sx,sy,6,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#8b4513'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(sx,sy,6,0,Math.PI*2); ctx.stroke();
}

function drawToriiTop(sx, sy) {
  // Torii gate from 3/4 perspective: draw the front face
  ctx.save();
  ctx.fillStyle='#8b1a1a';
  // Two vertical posts
  ctx.fillRect(sx-20,sy-4,6,40);
  ctx.fillRect(sx+14,sy-4,6,40);
  // Top horizontal beams
  ctx.fillRect(sx-28,sy-12,56,8);
  ctx.fillRect(sx-24,sy-4,48,5);
  // Top caps
  ctx.beginPath();
  ctx.moveTo(sx-28,sy-12);
  ctx.quadraticCurveTo(sx,sy-26,sx+28,sy-12);
  ctx.lineWidth=4; ctx.strokeStyle='#8b1a1a';
  ctx.stroke();
  // Glow
  ctx.globalAlpha=0.15;
  ctx.fillStyle='#ff6622';
  ctx.fillRect(sx-28,sy-12,56,8);
  ctx.restore();
}

function drawRockTop(sx, sy, sc) {
  ctx.save();
  ctx.globalAlpha=0.4;
  ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(sx+sc*4,sy+sc*3,sc*14,sc*8,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.fillStyle='#5a5050';
  ctx.beginPath(); ctx.ellipse(sx,sy,sc*13,sc*9,0.2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#6a6060';
  ctx.beginPath(); ctx.ellipse(sx-sc*3,sy-sc*2,sc*8,sc*5,0.1,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.ellipse(sx,sy,sc*13,sc*9,0.2,0,Math.PI*2); ctx.stroke();
}

function drawBannerTop(sx, sy) {
  ctx.fillStyle='#3a2010'; ctx.fillRect(sx-2,sy-30,4,30);
  ctx.fillStyle='#8b1a1a'; ctx.fillRect(sx,sy-28,16,18);
  ctx.strokeStyle='#c9a84c'; ctx.lineWidth=1;
  ctx.strokeRect(sx,sy-28,16,18);
  ctx.fillStyle='#c9a84c'; ctx.font='bold 11px Georgia'; ctx.textAlign='left';
  ctx.fillText('義',sx+2,sy-14);
}

function drawCastleTop(sx, sy) {
  // Castle footprint from above
  ctx.save();
  // Outer walls
  ctx.fillStyle='#1a1818';
  ctx.fillRect(sx-80,sy-60,160,120);
  // Inner keep
  ctx.fillStyle='#110e0e';
  ctx.fillRect(sx-40,sy-35,80,70);
  // Tower top (central)
  ctx.fillStyle='#0a0808';
  ctx.beginPath(); ctx.arc(sx,sy,20,0,Math.PI*2); ctx.fill();
  // Roof tiles pattern
  ctx.strokeStyle='#332828'; ctx.lineWidth=2;
  for(let r=-70;r<80;r+=12) {
    ctx.beginPath(); ctx.moveTo(sx+r,sy-60); ctx.lineTo(sx+r,sy+60); ctx.stroke();
  }
  for(let c=-55;c<70;c+=12) {
    ctx.beginPath(); ctx.moveTo(sx-80,sy+c); ctx.lineTo(sx+80,sy+c); ctx.stroke();
  }
  // Windows (glowing)
  ctx.fillStyle=`rgba(150,0,220,${0.5+Math.sin(Date.now()/300)*0.3})`;
  [[-30,-20],[30,-20],[-30,20],[30,20]].forEach(([wx,wy])=>{
    ctx.beginPath(); ctx.arc(sx+wx,sy+wy,5,0,Math.PI*2); ctx.fill();
  });
  // Aura
  ctx.globalAlpha=0.12+Math.sin(Date.now()/500)*0.06;
  ctx.strokeStyle='#9900cc'; ctx.lineWidth=6;
  ctx.shadowColor='#9900cc'; ctx.shadowBlur=20;
  ctx.beginPath(); ctx.arc(sx,sy,90,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}

function drawShrineTop(sx, sy) {
  // Shrine roof viewed from 3/4 top
  ctx.save();
  // Floor
  ctx.fillStyle='#7a5230';
  ctx.fillRect(sx,sy,10*TILE,12*TILE);
  // Roof (show as colored top)
  ctx.fillStyle='#2a1a0a';
  // Roof tiles
  ctx.strokeStyle='#3a2a1a'; ctx.lineWidth=2;
  for(let r=0;r<10*TILE;r+=8) {
    ctx.beginPath(); ctx.moveTo(sx+r,sy); ctx.lineTo(sx+r,sy+12*TILE); ctx.stroke();
  }
  // Ridge (center horizontal)
  ctx.fillStyle='#4a3010';
  ctx.fillRect(sx,sy,10*TILE,6);
  ctx.fillRect(sx,sy+6*TILE-3,10*TILE,6);
  ctx.fillRect(sx,sy+12*TILE-6,10*TILE,6);
  // Entrance steps
  ctx.fillStyle='#8a7a6a';
  ctx.fillRect(sx+4*TILE,sy+12*TILE,2*TILE,TILE);
  ctx.restore();
}

function drawBambooTop(sx, sy) {
  ctx.fillStyle='#2a5a1a';
  ctx.beginPath(); ctx.arc(sx,sy,5,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#4a8a2a'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(sx,sy-4); ctx.lineTo(sx,sy-10);
  ctx.moveTo(sx-3,sy-7); ctx.lineTo(sx-8,sy-12);
  ctx.moveTo(sx+3,sy-7); ctx.lineTo(sx+8,sy-12);
  ctx.stroke();
}

function drawLilyTop(sx, sy) {
  ctx.fillStyle='#2a8a1a';
  ctx.beginPath(); ctx.arc(sx,sy,6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ff8888';
  ctx.beginPath(); ctx.arc(sx,sy,2,0,Math.PI*2); ctx.fill();
}

function drawScenery() {
  const visible=sceneryObjects.filter(s=>{
    const sx=s.wx-cam.x, sy=s.wy-cam.y;
    return sx>-120&&sx<CW+120&&sy>-120&&sy<CH+120;
  });
  visible.forEach(s=>{
    const sx=s.wx-cam.x, sy=s.wy-cam.y;
    if(s.type==='cherry') drawCherryTree(sx,sy);
    else if(s.type==='lantern') drawLanternTop(sx,sy);
    else if(s.type==='torii') drawToriiTop(sx,sy);
    else if(s.type==='rock') drawRockTop(sx,sy,s.sc||0.8);
    else if(s.type==='banner') drawBannerTop(sx,sy);
    else if(s.type==='castle') drawCastleTop(sx,sy);
    else if(s.type==='shrine') drawShrineTop(sx,sy);
    else if(s.type==='bamboo') drawBambooTop(sx,sy);
    else if(s.type==='lily') drawLilyTop(sx,sy);
  });
}

// ─── DRAW GAMEPLAY ───────────────────────────────────────────
function drawGameplay() {
  waterAnim++;
  drawTiles();
  drawScenery();

  // Sort entities by Y for depth
  const entities = [];
  entities.push({type:'player',obj:player,y:player.y});
  enemies.forEach(e=>{ if(e.alive) entities.push({type:'enemy',obj:e,y:e.y}); });
  allies.forEach(a=>{ if(a.alive) entities.push({type:'ally',obj:a,y:a.y}); });
  entities.sort((a,b)=>a.y-b.y);

  entities.forEach(en=>{
    const scx=en.obj.x-cam.x, scy=en.obj.y-cam.y;
    if(en.type==='player') drawPlayer(scx,scy);
    else if(en.type==='enemy') drawEnemy(en.obj,scx,scy);
    else drawAlly(en.obj,scx,scy);
  });

  // Projectiles
  projectiles.forEach(p=>{
    ctx.save();
    ctx.globalAlpha=0.9;
    ctx.fillStyle=p.color;
    ctx.shadowColor=p.color; ctx.shadowBlur=12;
    ctx.beginPath();
    ctx.arc(p.x-cam.x,p.y-cam.y,p.size/2,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  });

  // Particles
  particles.forEach(p=>{
    ctx.save();
    ctx.globalAlpha=p.alpha;
    ctx.fillStyle=p.color;
    if(p.rot!==undefined) {
      ctx.translate(p.x-cam.x,p.y-cam.y);
      ctx.rotate(p.rot);
      // petal shape
      ctx.beginPath();
      ctx.ellipse(0,0,p.size*1.5,p.size*0.6,0,0,Math.PI*2);
      ctx.fill();
    } else {
      ctx.fillRect(p.x-cam.x-p.size/2,p.y-cam.y-p.size/2,p.size,p.size);
    }
    ctx.restore();
  });

  // Floating texts
  floats.forEach(f=>{
    ctx.save();
    ctx.globalAlpha=f.alpha;
    ctx.fillStyle=f.color;
    ctx.font='bold 13px Georgia';
    ctx.textAlign='center';
    ctx.shadowColor=f.color; ctx.shadowBlur=5;
    ctx.fillText(f.text,f.x-cam.x,f.y-cam.y);
    ctx.restore();
  });

  // Zone label
  const tx=Math.floor(player.x/TILE);
  const zoneName=tx<24?'Dorf':tx<44?'Bambuswald':tx<62?'Bergschrein':'Dämonenburg';
  ctx.save();
  ctx.globalAlpha=0.55;
  ctx.fillStyle='#c9a84c'; ctx.font='12px Georgia'; ctx.textAlign='right';
  ctx.fillText(zoneName,CW-20,26);
  ctx.restore();

  // Day/night moonlight tint (blue overlay)
  ctx.save();
  ctx.globalAlpha=0.12;
  ctx.fillStyle='#1a3a6a';
  ctx.fillRect(0,0,CW,CH);
  ctx.restore();

  // Vignette
  const vg=ctx.createRadialGradient(CW/2,CH/2,CH*0.25,CW/2,CH/2,CH*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.65)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,CW,CH);
}

// ─── INTRO CINEMATIC ─────────────────────────────────────────
const introScenes = [
  {
    duration:280,

      ctx.restore();
      ctx.save(); ctx.globalAlpha=Math.min(1,t/60);
      drawSilhouetteLandscape(300);
      ctx.restore();
      const titleAlpha=Math.min(1,Math.max(0,(t-80)/60));
      ctx.save(); ctx.globalAlpha=titleAlpha;
      ctx.fillStyle='#e8c87a'; ctx.font='bold 48px Georgia'; ctx.textAlign='center';
      ctx.shadowColor='rgba(200,140,0,0.8)'; ctx.shadowBlur=20;
      ctx.fillText('浪人伝説',450,150); ctx.shadowBlur=0;

      if(t>140) {
        const ta=Math.min(1,(t-140)/40);
        ctx.save(); ctx.globalAlpha=ta;
        ctx.fillStyle='#e0d0a0'; ctx.font='14px Georgia'; ctx.textAlign='center';
        const lines=['Das Jahr ist 1015 n. Chr. — Heian-Zeit.',
          'Du warst einst ein ehrenvoller Samurai des Fujiwara-Clans.',
          'Doch eine falsche Anschuldigung trieb dich in die Verbannung.',
          'Jetzt wanderst du allein — ein Rōnin ohne Meister.',
          'Doch das Land braucht dich. Dämonen erwachen...'];
        lines.forEach((l,i)=>{
          if(t>140+i*20){
            ctx.globalAlpha=Math.min(1,(t-140-i*20)/20)*ta;
            ctx.fillText(l,450,360+i*26);
          }
        });
        ctx.restore();
      }
      if(t>220) {
        ctx.save(); ctx.globalAlpha=(t-220)/60*0.7;
        ctx.fillStyle='#888'; ctx.font='12px Georgia'; ctx.textAlign='center';
        ctx.fillText('[Klick zum Überspringen]',450,560);
        ctx.restore();
      }
    }
  },
  {
    duration:260,
    render(t) {
      ctx.fillStyle='#0a0005'; ctx.fillRect(0,0,CW,CH);
      drawSilhouetteLandscape(320);
      const a=Math.min(1,t/50);
      ctx.save(); ctx.globalAlpha=a;
      for(let i=0;i<6;i++) drawSilhouetteHuman(100+i*60,300,0.85,'#111',true);
      const px=550+t*0.4;
      drawSilhouetteHuman(px,300,1,'#1a0a0a',false);
      ctx.strokeStyle='rgba(100,130,200,0.3)'; ctx.lineWidth=1;
      for(let i=0;i<60;i++) {
        const rx=(i*137+t*3)%CW;
        const ry=(i*73+t*4)%340+120;
        ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(rx-2,ry+12); ctx.stroke();
      }
      ctx.restore();
      if(t>80) {
        ctx.save(); ctx.globalAlpha=Math.min(1,(t-80)/40);
        ctx.fillStyle='#c4a86a'; ctx.font='italic 18px Georgia'; ctx.textAlign='center';
        ctx.fillText('"Verbannung — für Vergehen die ich nie beging."',450,120);
        ctx.restore();
      }
      if(t>160) {
        ctx.save(); ctx.globalAlpha=Math.min(1,(t-160)/40);
        ctx.fillStyle='#e8d4a0'; ctx.font='15px Georgia'; ctx.textAlign='center';
        ctx.fillText('Doch der Rōnin wird sich seinen Weg zurückerkämpfen.',450,500);
        ctx.fillText('Durch Blut, Ehre, und Ki-Kraft.',450,525);
        ctx.restore();
      }
    }
  }
];
let introScene=0, introTimer=0;
function introSkip(){introTimer=introScenes[introScene].duration+1;}

function drawSilhouetteLandscape(gy) {
  ctx.fillStyle='#0a0a1a';
  ctx.beginPath(); ctx.moveTo(0,gy+30);
  [0,80,150,230,310,390,450,530,620,700,780,860,900].forEach((mx,i)=>{
    const my=gy-[0,60,40,90,30,70,50,80,20,65,45,75,0][i];
    ctx.lineTo(mx,my);
  });
  ctx.lineTo(900,600); ctx.lineTo(0,600); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#0d0d0d'; ctx.fillRect(0,gy+30,900,600);
  ctx.fillStyle='#080808'; drawPagodaSilhouette(650,gy-20,50);
}
function drawPagodaSilhouette(x,y,s) {
  for(let i=0;i<4;i++) {
    ctx.beginPath();
    ctx.moveTo(x,y-i*s*0.6);
    ctx.lineTo(x+s*(0.9-i*0.15),y+(i+1)*s*0.28);
    ctx.lineTo(x-s*(0.9-i*0.15),y+(i+1)*s*0.28);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillRect(x-s*0.08,y+s*1.2,s*0.16,s*0.8);
}
function drawSilhouetteHuman(x,y,s,col,pointing) {
  ctx.fillStyle=col;
  ctx.beginPath(); ctx.arc(x,y-s*28,s*7,0,Math.PI*2); ctx.fill();
  ctx.fillRect(x-s*5,y-s*20,s*10,s*22);
  ctx.fillRect(x-s*14,y-s*19,s*10,s*14);
  if(pointing) ctx.fillRect(x+s*5,y-s*19,s*18,s*4);
  else ctx.fillRect(x+s*5,y-s*19,s*10,s*14);
  ctx.fillRect(x-s*4,y+s*2,s*4,s*20);
  ctx.fillRect(x,y+s*2,s*4,s*20);
}

// ─── CHARACTER CUSTOMIZATION ─────────────────────────────────
const customOptions = {
  armor:{label:'Rüstungsfarbe',options:[
    {label:'Blutrot',color:'#8b0000',accent:'#c9a84c'},
    {label:'Nachtblau',color:'#0d1a4a',accent:'#5588cc'},
    {label:'Waldgrün',color:'#1a3a1a',accent:'#88cc44'},
    {label:'Obsidian',color:'#1a1a1a',accent:'#888888'},
  ],selected:0},
  hair:{label:'Frisur',options:[
    {label:'Chonmage'},{label:'Langes Haar'},{label:'Rasiert'},{label:'Tengu-Maske'},
  ],selected:0},
  weapon:{label:'Waffe',options:[
    {label:'Katana',desc:'Schnell, ausgewogen'},
    {label:'Nodachi',desc:'Große Reichweite'},
    {label:'Naginata',desc:'Maximale Reichweite'},
  ],selected:0},
  mon:{label:'Clan-Symbol',options:[
    {label:'Chrysantheme'},{label:'Drache'},{label:'Phönix'},{label:'Mondkreis'},
  ],selected:0},
};
let customPage=0;
const customPages=Object.keys(customOptions);
let confirmHover=false, previewWalkFrame=0, previewWalkTimer=0;

function handleCustomizeClick(e) {
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(CW/rect.width);
  const my=(e.clientY-rect.top)*(CH/rect.height);
  const page=customPages[customPage];
  const opts=customOptions[page].options;
  opts.forEach((o,i)=>{
    if(mx>520&&mx<800&&my>(200+i*64)&&my<(200+i*64+52)) customOptions[page].selected=i;
  });
  if(mx>60&&mx<200&&my>520&&my<560&&customPage>0) customPage--;
  if(mx>360&&mx<500&&my>520&&my<560&&customPage<customPages.length-1) customPage++;
  if(customPage===customPages.length-1&&mx>310&&mx<590&&my>520&&my<560) {
    applyCustomization(); startGame();
  }
}
function applyCustomization() {
  const a=customOptions.armor.options[customOptions.armor.selected];
  player.armorColor=a.color; player.armorAccent=a.accent;
  player.hairStyle=customOptions.hair.selected;
  player.weapon=customOptions.weapon.selected;
  player.mon=customOptions.mon.selected;
}
canvas.addEventListener('mousemove',e=>{
  if(gameState!==STATE.CUSTOMIZE) return;
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(CW/rect.width);
  const my=(e.clientY-rect.top)*(CH/rect.height);
  confirmHover=mx>310&&mx<590&&my>520&&my<560;
});

function drawCustomizeScreen() {
  ctx.fillStyle='#080410'; ctx.fillRect(0,0,CW,CH);
  // Stars
  for(let i=0;i<60;i++) {
    ctx.fillStyle=`rgba(255,255,240,${0.2+Math.sin(Date.now()/1000+i)*0.2})`;
    ctx.fillRect((i*137.5)%CW,(i*73.3)%220,1,1);
  }
  ctx.fillStyle='#e8c87a'; ctx.font='bold 32px Georgia'; ctx.textAlign='center';
  ctx.shadowColor='rgba(200,140,0,0.6)'; ctx.shadowBlur=15;
  ctx.fillText('侍 Rōnin gestalten',450,50); ctx.shadowBlur=0;
  ctx.strokeStyle='#4a3a1a'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(80,65); ctx.lineTo(820,65); ctx.stroke();
  const page=customPages[customPage], cat=customOptions[page];
  ctx.fillStyle='#c4a86a'; ctx.font='18px Georgia'; ctx.textAlign='left';
  ctx.fillText(`${customPage+1}/${customPages.length}  —  ${cat.label}`,80,110);
  cat.options.forEach((opt,i)=>{
    const bx=520,by=200+i*64,bw=280,bh=52,sel=cat.selected===i;
    ctx.fillStyle=sel?'rgba(200,140,0,0.2)':'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,4); ctx.fill();
    ctx.strokeStyle=sel?'#c9a84c':'#3a2a10'; ctx.lineWidth=sel?2:1;
    ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,4); ctx.stroke();
    ctx.fillStyle=sel?'#e8d4a0':'#888';
    ctx.font=(sel?'bold ':'')+`16px Georgia`; ctx.textAlign='left';
    ctx.fillText(opt.label,bx+16,by+22);
    if(opt.desc){ctx.fillStyle='#666';ctx.font='12px Georgia';ctx.fillText(opt.desc,bx+16,by+40);}
    if(opt.color){ctx.fillStyle=opt.color;ctx.fillRect(bx+bw-40,by+10,30,30);
      ctx.strokeStyle=opt.accent||'#888';ctx.lineWidth=2;ctx.strokeRect(bx+bw-40,by+10,30,30);}
    if(sel){ctx.fillStyle='#c9a84c';ctx.font='16px Georgia';ctx.fillText('✓',bx+bw-20,by+28);}
  });
  // Preview character (top-down view)
  ctx.save();
  ctx.translate(220,320);
  previewWalkTimer++;
  if(previewWalkTimer>6){previewWalkTimer=0;previewWalkFrame++;}
  const pa=customOptions.armor.options[customOptions.armor.selected];
  const ph=customOptions.hair.selected;
  const headCols=['#1a0a00','#1a0a00','#d4956a','#cc2200'];
  drawTopDownChar(0,0,Math.PI/2,22,pa.color,headCols[ph],pa.accent||'#c9a84c',previewWalkFrame,false);
  ctx.restore();
  ctx.fillStyle='#666'; ctx.font='12px Georgia'; ctx.textAlign='center';
  ctx.fillText('Vorschau (Top-Down)',220,360);

  // Navigation
  ctx.textAlign='center';
  if(customPage>0){
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.beginPath();ctx.roundRect(60,520,140,40,4);ctx.fill();
    ctx.strokeStyle='#4a3a1a';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(60,520,140,40,4);ctx.stroke();
    ctx.fillStyle='#c4a86a';ctx.font='14px Georgia';ctx.fillText('◄ Zurück',130,545);
  }
  if(customPage<customPages.length-1){
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.beginPath();ctx.roundRect(360,520,140,40,4);ctx.fill();
    ctx.strokeStyle='#4a3a1a';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(360,520,140,40,4);ctx.stroke();
    ctx.fillStyle='#c4a86a';ctx.font='14px Georgia';ctx.fillText('Weiter ►',430,545);
  } else {
    ctx.fillStyle=confirmHover?'rgba(180,120,0,0.5)':'rgba(100,70,0,0.5)';
    ctx.beginPath();ctx.roundRect(310,520,280,40,4);ctx.fill();
    ctx.strokeStyle=confirmHover?'#ffd700':'#8b6914';ctx.lineWidth=confirmHover?2:1;
    ctx.beginPath();ctx.roundRect(310,520,280,40,4);ctx.stroke();
    ctx.fillStyle=confirmHover?'#ffd700':'#e8c87a';ctx.font='bold 16px Georgia';
    ctx.fillText('⚔  Spiel beginnen  ⚔',450,545);
  }
  customPages.forEach((_,i)=>{
    ctx.beginPath(); ctx.arc(430+i*20,500,i===customPage?5:3,0,Math.PI*2);
    ctx.fillStyle=i===customPage?'#c9a84c':'#3a2a10'; ctx.fill();
  });
}

// ─── GAME OVER / WIN ─────────────────────────────────────────
function drawGameOverScreen() {
  ctx.fillStyle='rgba(0,0,0,0.85)'; ctx.fillRect(0,0,CW,CH);
  ctx.fillStyle='#cc2200'; ctx.font='bold 56px Georgia'; ctx.textAlign='center';
  ctx.shadowColor='#ff0000'; ctx.shadowBlur=30;
  ctx.fillText('侍 Gefallen',450,260); ctx.shadowBlur=0;
  ctx.fillStyle='#888'; ctx.font='18px Georgia';
  ctx.fillText('Dein Rōnin ruht in Ehren.',450,310);
  ctx.fillStyle='#555'; ctx.font='14px Georgia';
  ctx.fillText(`Besiegte Feinde: ${player.kills}  |  Stufe: ${player.level}`,450,350);
  ctx.fillStyle='rgba(100,20,0,0.7)';
  ctx.beginPath();ctx.roundRect(350,400,200,50,4);ctx.fill();
  ctx.strokeStyle='#cc2200';ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(350,400,200,50,4);ctx.stroke();
  ctx.fillStyle='#e88';ctx.font='bold 16px Georgia';ctx.fillText('Neu starten',450,431);

}
function drawWinScreen() {
  ctx.fillStyle='rgba(0,0,0,0.88)'; ctx.fillRect(0,0,CW,CH);
  spawnParticles(450,300,'#ffdd00',3,6,80);
  ctx.fillStyle='#ffd700'; ctx.font='bold 52px Georgia'; ctx.textAlign='center';
  ctx.shadowColor='#ffaa00'; ctx.shadowBlur=40;
  ctx.fillText('勝利 Sieg!',450,230); ctx.shadowBlur=0;
  ctx.fillStyle='#e8d4a0'; ctx.font='20px Georgia';
  ctx.fillText('Du hast die Ehre des Rōnin wiederhergestellt!',450,285);
  ctx.fillStyle='#c4a86a'; ctx.font='16px Georgia';
  ctx.fillText(`Stufe ${player.level}  |  ${player.kills} Feinde besiegt  |  Stärke ${player.str}`,450,325);
  ctx.fillStyle='rgba(80,60,0,0.7)';
  ctx.beginPath();ctx.roundRect(350,380,200,50,4);ctx.fill();
  ctx.strokeStyle='#ffd700';ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(350,380,200,50,4);ctx.stroke();
  ctx.fillStyle='#ffd700';ctx.font='bold 16px Georgia';ctx.fillText('Nochmal spielen',450,411);
  canvas.addEventListener('click',checkRestartClick,{once:true});
}
function checkRestartClick(e) {
  const rect=canvas.getBoundingClientRect();
  const my=(e.clientY-rect.top)*(CH/rect.height);
  if(my>370&&my<450) location.reload();
  else canvas.addEventListener('click',checkRestartClick,{once:true});
}
function drawPauseScreen() {
  ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(0,0,CW,CH);
  ctx.fillStyle='#e8c87a'; ctx.font='bold 42px Georgia'; ctx.textAlign='center';
  ctx.fillText('一時停止',450,250);
  ctx.font='18px Georgia'; ctx.fillStyle='#888';
  ctx.fillText('ESC — Fortsetzen',450,310);
  ctx.fillText(`Stufe ${player.level}  |  Kills ${player.kills}  |  STR ${player.str}  DEF ${player.def}  KI ${player.kiPow}`,450,360);
}
function togglePause() {
  gameState=gameState===STATE.PAUSED?STATE.PLAYING:STATE.PAUSED;
}

// ─── START GAME ──────────────────────────────────────────────
function startGame() {
  buildMap();
  buildScenery();
  spawnEnemies();
  spawnAllies();
  gameState=STATE.PLAYING;
  document.getElementById('hud').style.opacity='1';
  document.getElementById('stat-panel').style.opacity='1';
  document.getElementById('controls-hint').style.opacity='1';
  updateStats(); updateHUD();
  setTimeout(()=>{document.getElementById('controls-hint').style.opacity='0';},5000);
  showMsg('Das Abenteuer des Rōnin beginnt... ⚔');
}

// ─── UTILITY ─────────────────────────────────────────────────
function darken(hex, factor) {
  const r=parseInt(hex.slice(1,3),16)*factor|0;
  const g=parseInt(hex.slice(3,5),16)*factor|0;
  const b=parseInt(hex.slice(5,7),16)*factor|0;
  return `rgb(${r},${g},${b})`;
}
function drawMon(x, y, r, type, color) {
  ctx.save(); ctx.translate(x,y); ctx.strokeStyle=color; ctx.lineWidth=0.8;
  ctx.beginPath();
  if(type===0){for(let i=0;i<8;i++){const a=i/8*Math.PI*2;ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.arc(0,0,r*0.4,0,Math.PI*2);}
  else if(type===1){ctx.arc(0,0,r,0,Math.PI*2);ctx.moveTo(-r*0.5,-r*0.5);ctx.lineTo(r*0.5,r*0.5);ctx.moveTo(r*0.5,-r*0.5);ctx.lineTo(-r*0.5,r*0.5);}
  else if(type===2){ctx.arc(0,-r*0.3,r*0.5,0,Math.PI*2);ctx.moveTo(0,r*0.2);ctx.lineTo(-r,r);ctx.lineTo(0,r*0.6);ctx.lineTo(r,r);}
  else{ctx.arc(0,0,r,0,Math.PI*2);ctx.moveTo(r*0.5,-r*0.5);ctx.arc(r*0.5,-r*0.5,r*0.3,0,Math.PI*2);}
  ctx.stroke(); ctx.restore();
}
if(!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.beginPath();this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.arcTo(x+w,y,x+w,y+r,r);
    this.lineTo(x+w,y+h-r);this.arcTo(x+w,y+h,x+w-r,y+h,r);
    this.lineTo(x+r,y+h);this.arcTo(x,y+h,x,y+h-r,r);
    this.lineTo(x,y+r);this.arcTo(x,y,x+r,y,r);this.closePath();return this;
  };
}

// ─── AMBIENT BLOSSOMS ────────────────────────────────────────
setInterval(()=>{
  if(gameState===STATE.PLAYING) {
    spawnBlossoms(player.x+Math.random()*300-150+cam.x, player.y-20+cam.y, 2);
  }
},2500);

// ─── MAIN LOOP ───────────────────────────────────────────────
function loop() {
  ctx.clearRect(0,0,CW,CH);
  if(gameState===STATE.INTRO) {
    introTimer++;
    introScenes[introScene].render(introTimer);
    if(introTimer>=introScenes[introScene].duration) {
      introScene++; introTimer=0;
      if(introScene>=introScenes.length) gameState=STATE.CUSTOMIZE;
    }
  }
  else if(gameState===STATE.CUSTOMIZE) drawCustomizeScreen();
  else if(gameState===STATE.PLAYING) {
    updatePlayer(); updateCamera(); updateEnemies();
    updateAllies(); updateProjectiles(); updateParticles(); updateFloats();
    drawGameplay();
  }
  else if(gameState===STATE.PAUSED) { drawGameplay(); drawPauseScreen(); }
  else if(gameState===STATE.GAMEOVER) { drawGameplay(); updateParticles(); drawGameOverScreen(); }
  else if(gameState===STATE.WIN) { drawGameplay(); updateParticles(); drawWinScreen(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
